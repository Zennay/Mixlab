name: MixLab ML-07 exact PCM reuse quality tests
on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/quality/reuse.py"
      - "tests/test_quality_reuse.py"
      - "docs/quality-pcm-reuse.md"
      - ".github/workflows/ml07-pcm-reuse.yml"
permissions:
  contents: read
jobs:
  synthetic-reuse-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout immutable PR head (no credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile scoped Python implementation and tests
        run: python3 -m py_compile mixlab/quality/reuse.py tests/test_quality_reuse.py
      - name: Execute synthetic privacy and stereo regression tests
        run: /usr/bin/time -f "ML07 reuse synthetic wall_seconds=%e peak_rss_kib=%M" python3 -m unittest discover -s tests -p 'test_quality_reuse.py' -v
      - name: Execute canonical quality regression suite
        run: python3 -m unittest discover -s tests -p 'test_quality.py' -v
