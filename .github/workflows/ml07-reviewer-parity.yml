name: ML-07 reviewer export and ingest parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'mixlab/quality/reviewer_export_parity.py'
      - 'tests/test_quality_reviewer_export_parity.py'
      - 'docs/quality-reviewer-export-parity.md'
      - '.github/workflows/ml07-reviewer-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml07-reviewer-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-contract:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact triggering source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify synthetic reviewer parity and privacy regressions
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 196608
          python -m compileall -q mixlab/quality/reviewer_export_parity.py tests/test_quality_reviewer_export_parity.py
          /usr/bin/time -v python -m unittest discover -s tests -p test_quality_reviewer_export_parity.py -v
