name: MixLab ML-07 private A-B assignment balance

on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/quality/assignment_balance.py"
      - "tests/test_quality_assignment_balance.py"
      - "docs/quality-assignment-balance.md"
      - ".github/workflows/ml07-assignment-balance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixlab-ml07-side-balance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  assignment-balance:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Immutable SHA checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact trigger revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run genuine five-pair synthetic PCM regressions
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 196608
          python -m py_compile mixlab/quality/assignment_balance.py tests/test_quality_assignment_balance.py
          /usr/bin/time -v python -m unittest discover -s tests -p 'test_quality_assignment_balance.py' -v
