name: ML-07 local DC-bias preflight
on:
  pull_request:
    paths:
      - 'mixlab/quality/local_dc.py'
      - 'tests/test_quality_local_dc.py'
      - 'docs/quality-local-dc.md'
      - '.github/workflows/ml07-local-dc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-dc-synthetic:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable source and Python syntax
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m compileall -q mixlab/quality/local_dc.py tests/test_quality_local_dc.py
      - name: Bounded synthetic DC, canonical quality and privacy tests
        run: |
          set -euo pipefail
          ulimit -v 196608
          /usr/bin/time -v python3 -m unittest discover -v -s tests -p 'test_quality_local_dc.py'
          /usr/bin/time -v python3 -m unittest discover -v -s tests -p 'test_quality.py'
          /usr/bin/time -v python3 -m unittest discover -v -s tests -p 'test_quality_cli_privacy.py'

  local-dc-python314:
    # Python 3.14 matches the live MixLab VPS interpreter version. Test on a
    # hosted runner only: never add a workload to the swap-exhausted VPS.
    needs: local-dc-synthetic
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6 commit
        with:
          python-version: '3.14'
      - name: Verify immutable source on Python 3.14
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python --version
          python -m compileall -q mixlab/quality/local_dc.py tests/test_quality_local_dc.py
      - name: Run focused private WAV QA and CLI privacy on Python 3.14
        run: |
          set -euo pipefail
          ulimit -v 196608
          /usr/bin/time -v python -m unittest discover -v -s tests -p 'test_quality_local_dc.py'
          /usr/bin/time -v python -m unittest discover -v -s tests -p 'test_quality_cli_privacy.py'
