name: MixLab ML-07 family sensitivity gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'mixlab/quality/family_sensitivity.py'
      - 'tests/test_quality_family_sensitivity.py'
      - 'docs/quality-family-sensitivity.md'
      - '.github/workflows/ml07-family-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-strata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up stdlib Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run real frozen five-pair family tests
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 196608
          python -m py_compile mixlab/quality/family_sensitivity.py tests/test_quality_family_sensitivity.py
          /usr/bin/time -v python -m unittest discover -s tests -p 'test_quality_family_sensitivity.py' -v
      - name: Existing canonical quality and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 196608
          python -m unittest discover -s tests -p 'test_quality.py' -v
          python -m unittest discover -s tests -p 'test_quality_cli_privacy.py' -v
