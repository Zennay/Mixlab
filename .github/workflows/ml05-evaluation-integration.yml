name: MixLab ML-05 live evaluation admission integration

on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/evaluation/__init__.py"
      - "tests/test_evaluation_admission_integration_20261017.py"
      - ".github/workflows/ml05-evaluation-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixlab-ml05-evaluation-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-evaluation-integration:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable PR source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify source is the requested immutable commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile evaluator and bounded input loader
        run: python3 -m compileall -q mixlab/evaluation tests/test_evaluation_admission_integration_20261017.py
      - name: Prove existing offline pilot still passes with strict input admission
        run: |
          python3 -m unittest -v \
            tests.test_evaluation_admission_integration_20261017 \
            tests.test_evaluation_json_admission \
            tests.test_evaluation
