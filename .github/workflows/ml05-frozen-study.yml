name: MixLab ML-05 frozen pair study

on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/evaluation/study.py"
      - "mixlab/evaluation/study_pack.py"
      - "tests/test_evaluation_study.py"
      - "tests/test_evaluation_study_pack.py"
      - ".github/workflows/ml05-frozen-study.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixlab-ml05-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  frozen-study:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile study module
        run: python3 -m compileall -q mixlab/evaluation tests/test_evaluation_study.py
      - name: Frozen study regressions
        run: python3 -m unittest -v tests.test_evaluation_study tests.test_evaluation_study_pack tests.test_evaluation tests.test_evaluation_json_admission
