name: MixLab ML-07 independent reviewer influence

on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/quality/reviewer_influence.py"
      - "tests/test_quality_reviewer_influence.py"
      - "docs/quality-reviewer-influence.md"
      - ".github/workflows/ml07-reviewer-influence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixlab-ml07-reviewer-influence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  genuine-reviewer-omission:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Reviewer omission frozen PCM (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout exact PR source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked out source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up stdlib Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Real PCM and forged reviewer adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 196608
          python -m py_compile mixlab/quality/reviewer_influence.py tests/test_quality_reviewer_influence.py
          /usr/bin/time -v python -m unittest discover -s tests -p 'test_quality_reviewer_influence.py' -v
