name: MixLab ML-07 offline quality regression
on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/quality/**"
      - "tests/test_quality.py"
      - "tests/test_quality_cli_privacy.py"
      - "docs/cpu-first-quality.md"
      - ".github/workflows/ml07-offline-quality.yml"
permissions:
  contents: read
jobs:
  quality:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile source
        run: python3 -m compileall -q mixlab/quality tests/test_quality.py tests/test_quality_cli_privacy.py
      - name: Run offline PCM16 quality regression
        run: python3 -m unittest discover -s tests -p "test_quality.py" -v
      - name: Run native CLI argument privacy and positive WAV acceptance
        run: python3 -m unittest discover -s tests -p "test_quality_cli_privacy.py" -v
