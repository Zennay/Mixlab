name: MixLab ML-07 real PCM holdout isolation

on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/quality/holdout_isolation.py"
      - "tests/test_quality_holdout_isolation.py"
      - "docs/quality-holdout-isolation.md"
      - ".github/workflows/ml07-holdout-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml07-holdout-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  genuine-pcm-source-disjointness:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Original PCM holdout integrity (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout exact PR source, no persistent credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact triggering commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python standard library runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test bounded actual PCM source and frozen holdout isolation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 196608
          python -m py_compile mixlab/quality/holdout_isolation.py tests/test_quality_holdout_isolation.py
          /usr/bin/time -v python -m unittest discover -s tests -p 'test_quality_holdout_isolation.py' -v
