name: MixLab ML-03 private analysis cache integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "mixlab/analysis/__init__.py"
      - "tests/test_analysis_cache_receipts.py"
      - "tests/test_analysis.py"
      - ".github/workflows/ml03-analysis-cache-integrity.yml"
  push:
    branches:
      - "fix/ml03-cache-receipt-integrity-20261017-zsentinel"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixlab-ml03-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cache-integrity:
    if: >-
      github.repository == 'Zennay/Mixlab' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
      && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 6
    steps:
      - name: Check out immutable candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile cache and synthetic regression modules
        run: python3 -m compileall -q mixlab/analysis tests/test_analysis.py tests/test_analysis_cache_receipts.py
      - name: Exercise hostile cache, race and audio fixtures
        run: python3 -m unittest -v tests.test_analysis_cache_receipts tests.test_analysis
      - name: Recheck complete offline synthetic suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
